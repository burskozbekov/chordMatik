name: Release

# Cut a release by pushing a version tag, e.g.:
#   npm version patch        # bumps package.json + tauri.conf.json? (see UPDATER.md)
#   git tag v0.1.1 && git push --tags
# tauri-action builds the signed macOS bundle, creates the GitHub Release, and
# uploads the updater artifacts (.app.tar.gz + .sig) plus latest.json — which is
# exactly what the in-app updater fetches from /releases/latest/download/latest.json.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Guard against a stale-version release: the updater only updates to a
      # HIGHER semver, so a tag that doesn't match tauri.conf.json would publish
      # a release that every install silently ignores. Fail fast instead.
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VER" != "$TAG_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VER) != tauri.conf.json version ($CONF_VER). Bump the version first."
            exit 1
          fi
          echo "version OK: $CONF_VER"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The minisign private key that matches the pubkey in tauri.conf.json.
          # Add these two as repository secrets (Settings → Secrets → Actions).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "chordMatik ${{ github.ref_name }}"
          releaseBody: "Automated release. The app auto-updates to this version on next launch."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
